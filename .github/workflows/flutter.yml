name: Flutter checks and builds
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test
      - name: Build demo web
        run: flutter build web --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: fafel-guide-web-demo
          path: build/web
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build installable demo APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: fafel-guide-android-demo
          path: build/app/outputs/flutter-apk/app-debug.apk
